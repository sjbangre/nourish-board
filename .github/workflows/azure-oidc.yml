name: Verify Azure federated login

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.repository == 'sjbangre/nourish-board' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the $name repository variable."
              exit 1
            fi
          done

      - name: Sign in using GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Verify access to the app resource group
        shell: bash
        run: |
          set -euo pipefail
          az group show --name "$AZURE_RESOURCE_GROUP" --query id --output none
          echo 'Azure OIDC login and resource-group access verified. No app was deployed.' >> "$GITHUB_STEP_SUMMARY"
