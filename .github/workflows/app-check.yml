name: Verify production domain
on:
  workflow_dispatch:
    inputs:
      canonical_origin:
        description: Expected OAuth callback origin
        required: true
        type: string
permissions: {}
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_ORIGIN: ${{ inputs.canonical_origin }}
    steps:
      - name: Verify public HTTPS, www redirect and OAuth callback
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const apex = 'https://healbelly.in';
          async function retry(label, operation) {
            let error;
            for (let attempt = 0; attempt < 6; attempt++) {
              try { await operation(); console.log(`${label}: passed`); return; }
              catch (e) { error = e; console.log(`${label}: retry ${attempt + 1}`); }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw error;
          }
          const request = (url, options = {}) => fetch(url, { signal: AbortSignal.timeout(45000), ...options });
          await retry('Apex HTTPS health', async () => {
            const response = await request(`${apex}/api/health`);
            if (!response.ok || (await response.json()).status !== 'ok') throw new Error('Apex health failed');
          });
          await retry('Homepage', async () => {
            const response = await request(apex);
            if (!response.ok || !response.headers.get('content-type')?.includes('text/html')) throw new Error('Homepage failed');
          });
          await retry('www HTTPS redirect preserves path and query', async () => {
            const response = await request('https://www.healbelly.in/api/health?probe=domain', { redirect: 'manual' });
            if (response.status !== 308 || response.headers.get('location') !== `${apex}/api/health?probe=domain`) throw new Error('www redirect failed');
          });
          await retry('Google OAuth callback configuration', async () => {
            const response = await request(`${apex}/api/auth/google`, { redirect: 'manual' });
            const location = response.headers.get('location');
            if (response.status !== 302 || !location) throw new Error('Google sign-in did not redirect');
            const target = new URL(location);
            if (target.hostname !== 'accounts.google.com' || target.searchParams.get('redirect_uri') !== `${process.env.EXPECTED_ORIGIN}/api/auth/google/callback`) throw new Error('Unexpected Google OAuth callback');
          });
          JS